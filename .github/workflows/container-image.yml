name: Release images
on:
  push:
    tags: ['*.*.*-*.*.*']

permissions:
  contents: read

# Avoid overlapping writes to the mutable latest tags.
concurrency:
  group: ghcr-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'burkostya/archimate-ci-image'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      packages: write
      contents: write
    env:
      TEST_IMAGE: ghcr.io/burkostya/archimate-ci-image
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py "$RELEASE_TAG"
      - name: Refuse to overwrite an existing release
        run: scripts/publish.sh preflight
      - name: Build and test both images
        run: scripts/build-test.sh
      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and release
        run: scripts/publish.sh publish
      - name: Preserve reports and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: test-results/
          include-hidden-files: true
